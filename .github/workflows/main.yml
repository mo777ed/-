name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check project files are uploaded
        run: |
          for f in pubspec.yaml lib/main.dart lib/screens/home_screen.dart assets/images/logo_full.png assets/fonts/Amiri-Regular.ttf; do
            if [ ! -f "$f" ]; then echo "::error::الملف ناقص في المستودع: $f (ارفع مجلد lib و assets كاملين)"; exit 1; fi
          done
          grep -q mobile_scanner pubspec.yaml || { echo "::error::pubspec.yaml ليس ملف المقداع"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android/iOS folders (without touching lib)
        run: |
          flutter create --org com.almegdaa --project-name almegdaa --platforms=android,ios /tmp/tpl
          cp -r /tmp/tpl/android ./android
          cp -r /tmp/tpl/ios ./ios

      - name: Patch Android (camera permission, app name, minSdk)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application|' $M
          sed -i 's|android:label="[^"]*"|android:label="المقداع"|' $M
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] && sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' "$f"
          done
          # فرض compileSdk 36 على كل مكتبات أندرويد (يحل خطأ file_picker / android-34)
          K=android/build.gradle.kts
          G=android/build.gradle
          if [ -f "$K" ]; then
            cat > /tmp/patch.kts <<'KTS'
          subprojects {
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.api.variant.LibraryAndroidComponentsExtension> {
                      finalizeDsl { ext -> ext.compileSdk = 36 }
                  }
              }
          }

          KTS
            cat /tmp/patch.kts "$K" > /tmp/new.kts && mv /tmp/new.kts "$K"
          elif [ -f "$G" ]; then
            printf '%s\n' 'subprojects { afterEvaluate { p -> if (p.plugins.hasPlugin("com.android.library")) { p.android.compileSdkVersion 36 } } }' | cat - "$G" > /tmp/new.gradle && mv /tmp/new.gradle "$G"
          fi
          head -20 android/build.gradle* || true

      - run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: almegdaa-apk
          path: build/app/outputs/flutter-apk/app-release.apk
